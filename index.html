<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12030d">
  <meta name="description" content="Athletic Diamond — official links">
  <title>Athletic Diamond — Links</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, #6d174d 0, #260a1d 35%, #0c0309 78%);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,70,177,.18), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(255,0,119,.12), transparent 30%);
      filter: blur(25px);
      animation: drift 10s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 1%, 0) scale(1.04); }
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      padding: 48px 20px 36px;
      text-align: center;
    }
    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,157,218,.65);
      box-shadow: 0 0 45px rgba(255,36,161,.28);
      background: #190711;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 2px;
      font-weight: 900;
      text-shadow: 0 0 25px rgba(255,70,177,.35);
    }
    .handle {
      margin: 8px 0 28px;
      color: #e3a4ca;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .links {
      display: grid;
      gap: 13px;
    }
    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 62px;
      padding: 0 58px;
      border: 1px solid rgba(255,151,216,.22);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,20,140,.055));
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 28px rgba(0,0,0,.2);
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link:hover, .link:active {
      transform: translateY(-3px) scale(1.01);
      background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,20,140,.12));
      border-color: rgba(255,151,216,.55);
      box-shadow: 0 12px 35px rgba(255,20,140,.15);
    }
    .icon {
      position: absolute;
      left: 20px;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 900;
      background: rgba(255,255,255,.12);
    }
    .arrow {
      position: absolute;
      right: 20px;
      color: #d889b7;
      font-size: 19px;
      transition: transform .18s ease, color .18s ease;
    }
    .link:hover .arrow { transform: translateX(4px); color: #fff; }

    .tg .icon { background: #229ED9; }
    .sc .icon { background: #ff5500; }
    .tt .icon { background: #111; border: 1px solid #666; }
    .ya .icon { background: #ff0033; }
    .sp .icon { background: #1ed760; }
    .vk .icon { background: #0077ff; }
    .am .icon { background: #fff; color: #111; }

    .note {
      margin-top: 25px;
      color: #9e567f;
      font-size: 11px;
      line-height: 1.5;
    }
    footer {
      margin-top: 34px;
      color: #6f3859;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @media (max-width: 430px) {
      .wrap { padding-top: 34px; }
      h1 { font-size: 25px; }
      .link { min-height: 58px; }
    }
  </style>
</head>
